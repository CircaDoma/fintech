<style>
  :root {
    --bg:  #2E282A;   /* Jet          - background                        */
    --fg:  #B4C1A8;   /* sage         - body text, borders, chart, meters */
    --pos: #B4C1A8;   /* sage         - on/under budget (same as --fg)    */
    --neg: #CD5334;   /* Flame        - over budget, alarms               */
    --hi:  #EEEEEE;   /* Pale Dogwood - headings and hero numerals        */
    --dim: #4A4640;   /* rules, empty meter segments                      */
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--fg); }
  body { font-family:'Silkscreen',monospace; font-size:13px; letter-spacing:.5px;
         padding:env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 84px);
         max-width:480px; margin:0 auto; }
  svg { image-rendering:pixelated; }
  .d { font-family:'Press Start 2P',monospace; }
  h2 { font-weight:400; margin:0; }
  .eyebrow { font-size:12px; color:var(--hi); margin:24px 0 8px; }
  button { font-family:'Silkscreen',monospace; font-size:12px; letter-spacing:.5px;
           color:var(--fg); background:var(--bg); border:2px solid var(--fg);
           padding:8px 10px; border-radius:0; cursor:pointer; }
  button:active { background:var(--fg); color:var(--bg); }
  button:disabled { opacity:.3; }
  button[aria-pressed="true"] { background:var(--fg); color:var(--bg); }
  .nav { display:flex; align-items:center; gap:8px; }
  .nav .d { font-size:11px; flex:1; text-align:center; color:var(--hi); }
  .nav button { min-width:46px; min-height:42px; }
  #monthNav { margin:22px 0 4px; }
  #monthNav .d { font-size:11px; color:var(--fg); line-height:1.6; }
  #monthNav button { border-color:var(--dim); color:var(--fg);
                     min-height:38px; padding:6px 10px; }
  .hero { font-size:22px; line-height:1.6; margin-bottom:8px; color:var(--hi);
          padding-top:4px; overflow:visible; -webkit-font-smoothing:none;
          font-synthesis:none; }
  .delta { font-size:13px; margin-bottom:12px; }
  .delta div { line-height:1.7; }
  #gHeroLabel { margin-bottom:2px; color:var(--hi); }
  #gHeroSub { margin-bottom:0; }
  #chartWrap { position:relative; }
  #chart { height:112px; display:flex; align-items:flex-end; gap:2px;
           position:relative; z-index:1; margin-left:42px; }
  #ticks { position:absolute; inset:0; pointer-events:none; z-index:0; }
  #ticks .tick { position:absolute; left:42px; right:0; height:0;
                 border-top:1px solid var(--dim); }
  #ticks .tick span { position:absolute; left:-42px; top:-8px; width:36px;
                      text-align:right; font-size:10px; color:var(--hi); }
  #chart div { flex:1; background:var(--pos); border-top:3px solid var(--hi); }
  .tabs { display:flex; gap:4px; margin-top:10px; }
  .tabs button { flex:1; }
  .row { display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:2px solid var(--dim); }
  .row .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .amt { font-size:14px; }
  .den { color:var(--fg); font-size:11px; }
  .sum { display:flex; justify-content:space-between; padding:5px 0; font-size:13px; }
  .goal { margin-bottom:14px; }
  .goal .top { display:flex; justify-content:space-between; margin-bottom:5px; }
  .meter { display:flex; gap:2px; }
  .meter i { flex:1; height:14px; background:var(--dim); }
  .meter.big { margin:14px 0 4px; }
  .meter.big i { height:22px; }
  .meter i.on { background:var(--pos); }
  #gate { padding:56px 0; text-align:center; }
  #gate p { color:var(--hi); font-size:12px; margin:0 0 20px; }
  #err { color:var(--neg); font-size:12px; padding:12px 0; }
  .hidden { display:none; }
  hr.rule { border:0; border-top:2px solid var(--dim); margin:28px 0 0; }
  #stamp { display:block; width:100%; border:0; background:none;
           font-family:'Silkscreen',monospace; letter-spacing:.5px;
           font-size:11px; color:var(--dim); text-align:center;
           padding:34px 0 4px; }
  #updated { font-size:11px; color:var(--dim); text-align:center; padding:0 0 14px; }
  #staleBanner { background:var(--neg); color:#FFFFFF; font-size:11px; line-height:1.6;
                 padding:10px 12px; margin:14px 0 4px;
                 display:flex; align-items:flex-start; gap:10px; }
  #staleBanner.hidden { display:none; }
  #staleBanner span { flex:1; }
  #bannerX { flex-shrink:0; border:0; background:none; color:#FFFFFF;
             width:32px; height:32px; margin:-6px -6px 0 0; padding:0;
             line-height:0; cursor:pointer;
             display:flex; align-items:center; justify-content:center; }
  #bannerX:active { opacity:.55; }
  #logo-wrap { display:flex; justify-content:center; padding:0 0 6px; color:var(--dim); }
  #logo-wrap svg { width:104px; height:auto; display:block; }
  .view { min-height:calc(100svh - 210px); }

  .spot { display:flex; gap:8px; margin:18px 0 4px; }
  .spot > div { flex:1; border:2px solid var(--dim); padding:10px 10px 12px; }
  .spot .lbl { font-size:11px; color:var(--hi); margin-bottom:8px;
               overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .spot .val { font-family:'Press Start 2P',monospace; font-size:13px;
               line-height:1.5; padding-top:3px; }

  .sect { font-size:12px; color:var(--hi); margin:22px 0 2px;
          padding-bottom:5px; border-bottom:2px solid var(--hi); }
  .headrow { display:flex; align-items:center; gap:8px; margin:24px 0 8px; }
  .headrow .eyebrow { margin:0; }
  .tog { width:30px; height:30px; padding:0; line-height:0; flex-shrink:0;
         border:2px solid var(--dim); background:var(--bg); color:var(--fg); }
  .tog[aria-pressed="true"] { border-color:var(--hi); color:var(--hi); }
  .row.on .nm { color:var(--hi); }

  /* ---- fixed bottom tab bar ---- */
  #tabbar { position:fixed; left:0; right:0; bottom:0; z-index:10;
            background:var(--bg); border-top:2px solid var(--fg);
            padding-bottom:env(safe-area-inset-bottom);
            transform:translateZ(0); will-change:transform;
            -webkit-backface-visibility:hidden; }
  @supports (bottom: env(safe-area-inset-bottom)) {
    #tabbar { padding-bottom:max(env(safe-area-inset-bottom), 0px); }
  }
  #tabbar .inner { max-width:480px; margin:0 auto; display:flex; height:58px; }
  #tabbar button { flex:1; border:0; border-radius:0; padding:0;
                   color:var(--dim); background:var(--bg); line-height:0;
                   display:flex; align-items:center; justify-content:center; }
  #tabbar button[aria-pressed="true"] { color:var(--hi); }
  #tabbar button span { display:inline-block; padding-bottom:6px;
                        border-bottom:3px solid transparent; }
  #tabbar button[aria-pressed="true"] span { border-bottom-color:var(--hi); }
  #tabbar button:active { color:var(--fg); }

<script>
var SCOPE = "https://www.googleapis.com/auth/drive.file";
function $(id){ return document.getElementById(id); }

var token=null, tokenClient=null;
var sheetId = localStorage.getItem("sheetId");

var cats=[];        // {name, group, col}
var periods=[];     // {label, goal[], actual[], balance[]}
var nw=[];          // {label, value}
var goals=[];       // {name, saved, target}
var accts=[];       // {name, value} - latest balance per account
var lastTxn="";     // BD1: date of the newest transaction entered
var mIdx=0, chartMonths=0, view="worth";
var sel=[];         // indices into accts; empty = show combined total
var cachedAt=0;
var CACHE_V=4;
var BUILD="v12";

function money(n){ return (n<0?"-":"")+"$"+Math.abs(Math.round(n)).toLocaleString(); }

var MONTH_NAMES = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE",
                   "JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];

function monthFromName(str){
  var k = String(str).trim().toUpperCase().slice(0,3);
  for(var i=0;i<12;i++) if(MONTH_NAMES[i].slice(0,3) === k) return i;
  return -1;
}

/* Only ISO strings are guaranteed parseable by new Date(). Everything else is
   engine-defined: V8 accepts "Dec 2026", Safari's JavaScriptCore returns
   Invalid Date for it. So every shape is matched explicitly, and new Date()
   is only a last resort. */
function parseMonthParts(v){
  var t = String(v==null ? "" : v).trim();
  if(!t) return null;
  var m;

  m = /^(\d{4})[-\/.](\d{1,2})/.exec(t);                 /* 2026-12, 2026-12-01 */
  if(m) return { y:+m[1], m:+m[2]-1 };

  m = /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/.exec(t);  /* 12/1/2026 */
  if(m) return { y:+m[3], m:+m[1]-1 };

  m = /^([A-Za-z]{3,9})[\s\-.,]+(\d{2,4})/.exec(t);      /* Dec 2026, December 2026 */
  if(m){
    var mi = monthFromName(m[1]);
    if(mi >= 0){ var y = +m[2]; return { y: y<100 ? 2000+y : y, m:mi }; }
  }

  m = /^(\d{4})[\s\-.,]+([A-Za-z]{3,9})/.exec(t);        /* 2026 Dec */
  if(m){
    var mj = monthFromName(m[2]);
    if(mj >= 0) return { y:+m[1], m:mj };
  }

  var d = new Date(t);
  if(!isNaN(d)) return { y:d.getFullYear(), m:d.getMonth() };
  return null;
}

function monthLabel(v){
  var p = parseMonthParts(v);
  return p ? MONTH_NAMES[p.m] + " " + p.y
           : String(v==null ? "" : v).trim().toUpperCase();
}

/* Full-date parsing for BD1. Same rule as above: match every shape explicitly
   and only fall back to new Date() for anything unmatched. */
function parseDate(v){
  var t = String(v==null ? "" : v).trim();
  if(!t) return null;
  var m;

  m = /^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/.exec(t);            /* 2026-08-14 */
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);

  m = /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/.exec(t);            /* 8/14/2026 */
  if(m) return new Date(+m[3], +m[1]-1, +m[2]);

  m = /^([A-Za-z]{3,9})[\s.]+(\d{1,2})(?:st|nd|rd|th)?[\s,]+(\d{4})/.exec(t);  /* Aug 14, 2026 */
  if(m){
    var mi = monthFromName(m[1]);
    if(mi >= 0) return new Date(+m[3], mi, +m[2]);
  }

  m = /^(\d{1,2})[\s.-]+([A-Za-z]{3,9})[\s.,-]+(\d{4})/.exec(t);   /* 14 Aug 2026 */
  if(m){
    var mj = monthFromName(m[2]);
    if(mj >= 0) return new Date(+m[3], mj, +m[1]);
  }

  var d = new Date(t);
  return isNaN(d) ? null : d;
}

function daysSince(d){
  if(!d) return null;
  var a = new Date(); a.setHours(0,0,0,0);
  var b = new Date(d); b.setHours(0,0,0,0);
  return Math.round((a-b)/86400000);
}

function agoText(n){
  return n<=0 ? "TODAY" : n===1 ? "1 DAY AGO" : n + " DAYS AGO";
}
function num(v){ if(typeof v==="number") return v;
  var p=parseFloat(String(v==null?"":v).replace(/[^0-9.-]/g,"")); return isNaN(p)?0:p; }
function cell(row,i){ return (row && row[i]!==undefined) ? row[i] : null; }
function fail(m){ $("err").textContent=m; }

/* ---------- local cache so the app renders before any sign-in ---------- */
function cacheKey(){ return "cache:"+CACHE_V+":"+sheetId; }

function saveCache(){
  try {
    localStorage.setItem(cacheKey(), JSON.stringify({
      ts:Date.now(), cats:cats, periods:periods, nw:nw, goals:goals,
      accts:accts, lastTxn:lastTxn
    }));
  } catch(e){ /* quota or private mode - not fatal */ }
}

function loadCache(){
  if(!sheetId) return false;
  try {
    var raw = localStorage.getItem(cacheKey());
    if(!raw) return false;
    var c = JSON.parse(raw);
    if(!c.periods || !c.periods.length) return false;
    cats=c.cats; periods=c.periods; nw=c.nw||[]; goals=c.goals||[];
    accts=c.accts||[]; lastTxn=c.lastTxn||""; cachedAt=c.ts||0; sel=[];
    pickCurrentMonth();
    return true;
  } catch(e){ return false; }
}

function setStamp(){
  var el=$("stamp");
  if(!cachedAt){ el.textContent=""; return; }
  var mins = Math.floor((Date.now()-cachedAt)/60000);
  var ago = mins<1    ? "JUST NOW"
          : mins<60   ? mins+" MIN AGO"
          : mins<1440 ? Math.floor(mins/60)+" HR AGO"
          :             Math.floor(mins/1440)+" DAYS AGO";
  el.textContent = token ? ("LAST SYNCED " + ago)
                         : ("LAST SYNCED " + ago + "  \u00B7  TAP TO SYNC");
  el.style.color = mins>2880 ? "var(--neg)" : "var(--dim)";
  setUpdated();
}

var STALE_DAYS = 7;
var bannerOff = false;   /* in memory only: comes back on reload or resync */

function setUpdated(){
  var d = parseDate(lastTxn), n = daysSince(d);
  $("updated").textContent = (n===null)
    ? ""
    : "BUDGET LAST UPDATED " + agoText(n) + "  \u00B7  " + BUILD;

  var b = $("staleBanner");
  if(n !== null && n > STALE_DAYS && !bannerOff){
    b.innerHTML = '<span>BUDGET LAST UPDATED ' + agoText(n)
                + '. ADD YOUR RECENT TRANSACTIONS FOR ACCURATE NUMBERS.</span>'
                + '<button id="bannerX" aria-label="Dismiss">'
                + '<svg viewBox="0 0 7 7" width="11" height="11" shape-rendering="crispEdges" '
                + 'fill="currentColor" aria-hidden="true">'
                + '<rect x="0" y="0" width="2" height="1"/><rect x="5" y="0" width="2" height="1"/>'
                + '<rect x="1" y="1" width="2" height="1"/><rect x="4" y="1" width="2" height="1"/>'
                + '<rect x="2" y="2" width="3" height="1"/>'
                + '<rect x="2" y="3" width="3" height="1"/>'
                + '<rect x="2" y="4" width="3" height="1"/>'
                + '<rect x="1" y="5" width="2" height="1"/><rect x="4" y="5" width="2" height="1"/>'
                + '<rect x="0" y="6" width="2" height="1"/><rect x="5" y="6" width="2" height="1"/>'
                + '</svg></button>';
    $("bannerX").onclick = function(){ bannerOff = true; setUpdated(); };
    b.classList.remove("hidden");
  } else {
    b.classList.add("hidden");
  }
}

function showApp(){
  $("gate").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("tabbar").classList.remove("hidden");
  render();
  setStamp();
  setView(view);
}

/* ---------- bottom tab bar ---------- */
function setView(v){
  view = v;
  ["worth","budget","goals"].forEach(function(name){
    $("v-"+name).classList.toggle("hidden", name!==v);
  });
  Array.prototype.forEach.call($("tabbar").querySelectorAll("button"), function(b){
    b.setAttribute("aria-pressed", String(b.dataset.view===v));
  });
  window.scrollTo(0,0);
}

Array.prototype.forEach.call(document.querySelectorAll("#tabbar button"), function(b){
  b.onclick = function(){ setView(b.dataset.view); };
});

var waiting = setInterval(function(){
  if(!window.google || !window.google.accounts || !window.gapi) return;
  clearInterval(waiting);
  gapi.load("picker", function(){});
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPE,
    callback: function(res){
      if(res.error){
        $("signin").disabled=false;
        fail(periods.length ? "Showing saved data. Tap RELOAD to sign in."
                            : "Sign-in failed. Tap to retry.");
        return;
      }
      token = res.access_token;
      $("err").textContent="";
      if(sheetId) load(); else showPicker();
    }
  });
  $("signin").disabled=false;
  /* Safari blocks any popup not opened directly by a tap, and Google's token
     client opens one even with prompt:"". So boot renders from cache only;
     every token request below is triggered by a user gesture. */
  if(sheetId && loadCache()) showApp();
}, 100);

$("signin").onclick  = function(){ $("err").textContent=""; tokenClient.requestAccessToken(); };
$("pick").onclick    = function(){ showPicker(); };
$("stamp").onclick = function(){ token ? load() : tokenClient.requestAccessToken({prompt:""}); };

function showPicker(){
  $("pick").classList.remove("hidden");
  new google.picker.PickerBuilder()
    .setAppId(APP_ID).setOAuthToken(token).setDeveloperKey(API_KEY)
    .addView(new google.picker.DocsView(google.picker.ViewId.SPREADSHEETS))
    .setCallback(function(d){
      if(d.action !== google.picker.Action.PICKED) return;
      sheetId = d.docs[0].id;
      localStorage.setItem("sheetId", sheetId);
      load();
    }).build().setVisible(true);
}

async function load(){
  $("err").textContent="";
  var url = "https://sheets.googleapis.com/v4/spreadsheets/"+sheetId+"/values:batchGet"
    + "?ranges=" + encodeURIComponent(TAB+"!A1:AF")
    + "&ranges=" + encodeURIComponent(TAB+"!AH1:AY")
    + "&ranges=" + encodeURIComponent(TAB+"!AZ1:BC")
    + "&ranges=" + encodeURIComponent(TAB+"!BD1")
    + "&valueRenderOption=UNFORMATTED_VALUE"
    + "&dateTimeRenderOption=FORMATTED_STRING";
  try {
    var res = await fetch(url,{headers:{Authorization:"Bearer "+token}});
    var data = await res.json();
    if(res.status===401){ token=null; tokenClient.requestAccessToken({prompt:""}); return; }
    if(!res.ok){ fail("Sheet error: "+((data.error&&data.error.message)||res.status)); return; }
    var v = data.valueRanges.map(function(r){ return r.values||[]; });
    parseBudget(v[0]); parseNetWorth(v[1]); parseGoals(v[2]);
    lastTxn = (v[3] && v[3][0] && v[3][0][0] != null) ? String(v[3][0][0]) : "";
    if(!periods.length){ fail("No month rows found on the "+TAB+" tab."); return; }
    bannerOff = false;
    cachedAt = Date.now();
    saveCache();
    showApp();
  } catch(e){
    fail(periods.length ? "Offline - showing saved data." : "Network error. Check your connection.");
  }
}

/* Section 1: row 1 = group labels (sparse), row 2 = category names,
   then repeating triplets of Goal / Actual / Balance with the month in column A. */
function parseBudget(rows){
  var groupRow = rows[0]||[], nameRow = rows[1]||[];
  cats = [];
  var current = "";
  for(var c=2; c<=31; c++){
    if(cell(groupRow,c)) current = String(cell(groupRow,c)).trim();
    var nm = cell(nameRow,c);
    if(nm) cats.push({ name:String(nm).trim(), group:current, col:c });
  }
  periods = [];
  for(var r=2; r+2<rows.length || r<rows.length; r+=3){
    var g=rows[r], a=rows[r+1], b=rows[r+2];
    if(!g) break;
    var label = cell(g,0);
    if(!label && !cell(g,2)) continue;
    periods.push({
      label: label ? String(label).trim() : "Month "+(periods.length+1),
      goal:    cats.map(function(x){ return num(cell(g,x.col)); }),
      actual:  cats.map(function(x){ return num(cell(a,x.col)); }),
      balance: cats.map(function(x){ return num(cell(b,x.col)); })
    });
  }
  pickCurrentMonth();
}

function pickCurrentMonth(){
  mIdx = periods.length - 1;
  var now = new Date(), y = now.getFullYear(), m = now.getMonth();
  for(var i=0;i<periods.length;i++){
    var p = parseMonthParts(periods[i].label);
    if(p && p.y===y && p.m===m){ mIdx=i; break; }
  }
}

/* Section 2: row 1 headers (first col = date, last col = Total). */
function parseNetWorth(rows){
  var head = rows[0]||[], tot = head.length-1;
  for(var i=0;i<head.length;i++) if(String(head[i]).trim().toLowerCase()==="total") tot=i;
  /* Columns between the date and the Total are the individual accounts. */
  accts = []; sel = [];
  var cols = [];
  for(var c=1;c<tot;c++){
    var nm = cell(head,c);
    if(!nm) continue;
    cols.push(c);
    accts.push({ name:String(nm).trim(), value:0 });
  }
  nw = [];
  for(var r=1;r<rows.length;r++){
    var row = rows[r];
    if(!row || cell(row,0)==null || cell(row,tot)==null) continue;
    nw.push({
      label: String(cell(row,0)),
      value: num(cell(row,tot)),
      vals:  cols.map(function(c){ return num(cell(row,c)); })
    });
  }
  /* Current balances come from the most recent row. */
  if(nw.length){
    var lastVals = nw[nw.length-1].vals;
    accts.forEach(function(a,i){ a.value = lastVals[i]; });
  }
}

/* Section 3: Category / Saved / Remainder / Goal, ending before any total row. */
var HIDE_GOALS = ["Tax Fund"];

function parseGoals(rows){
  goals = [];
  for(var r=1;r<rows.length;r++){
    var row = rows[r];
    var nm = cell(row,0);
    if(!nm) continue;
    var s = String(nm).trim();
    if(/^total/i.test(s)) break;
    var skip = false;
    for(var k=0;k<HIDE_GOALS.length;k++)
      if(HIDE_GOALS[k].toLowerCase() === s.toLowerCase()) skip = true;
    if(skip) continue;
    goals.push({ name:s, saved:num(cell(row,1)), target:num(cell(row,3)) });
  }
}

function render(){ renderNetWorth(); renderAccounts(); renderBudget(); renderGoals(); }

var PLUS  = '<svg viewBox="0 0 8 8" width="12" height="12" shape-rendering="crispEdges" '
          + 'fill="currentColor" aria-hidden="true">'
          + '<rect x="3" y="0" width="2" height="8"/><rect x="0" y="3" width="8" height="2"/></svg>';
var MINUS = '<svg viewBox="0 0 8 8" width="12" height="12" shape-rendering="crispEdges" '
          + 'fill="currentColor" aria-hidden="true"><rect x="0" y="3" width="8" height="2"/></svg>';

function renderAccounts(){
  $("clearSel").classList.toggle("hidden", sel.length===0);
  if(!accts.length){ $("accounts").innerHTML =
      '<div class="row"><span class="nm">No account columns found</span></div>'; return; }
  var asOf = nw.length ? nw[nw.length-1].label : "";
  $("accounts").innerHTML = accts.map(function(a,i){
    var on = sel.indexOf(i) >= 0;
    return '<div class="row'+(on?" on":"")+'">'
         + '<button class="tog" data-i="'+i+'" aria-pressed="'+on+'" aria-label="'
         + (on?"Remove ":"Add ")+a.name+' from chart">'+(on?MINUS:PLUS)+'</button>'
         + '<span class="nm">'+a.name.toUpperCase()+'</span>'
         + '<span class="amt" style="color:'+(a.value<0?"var(--neg)":"var(--fg)")+'">'
         + money(a.value)+'</span>'
         + '</div>';
  }).join("")
  + (asOf ? '<div class="sum" style="opacity:.7;padding-left:38px"><span>AS OF</span><span>'+asOf+'</span></div>' : "");
}

/* Delegated so the handler survives every re-render. */
$("accounts").onclick = function(e){
  var b = e.target.closest ? e.target.closest(".tog") : null;
  if(!b) return;
  var i = parseInt(b.dataset.i,10), at = sel.indexOf(i);
  if(at >= 0) sel.splice(at,1); else sel.push(i);
  renderAccounts(); renderNetWorth();
};

$("clearSel").onclick = function(){
  sel = [];
  renderAccounts(); renderNetWorth();
};

/* Value of one history row under the current account selection.
   No selection means the sheet's own Total column. */
function seriesVal(p){
  if(!sel.length) return p.value;
  if(!p.vals) return 0;
  var t=0;
  for(var i=0;i<sel.length;i++) t += (p.vals[sel[i]]||0);
  return t;
}

function renderNetWorth(){
  var s = chartMonths ? nw.slice(-chartMonths) : nw;
  if(!s.length){ $("nw").textContent="No data"; $("nwDelta").textContent=""; $("chart").innerHTML=""; return; }
  var last = seriesVal(s[s.length-1]), diff = last - seriesVal(s[0]);
  var first = seriesVal(s[0]);
  var pct = first ? (diff/Math.abs(first))*100 : 0;
  $("nw").textContent = money(last);
  $("nwDelta").textContent = (diff>=0?"\u25B2 +":"\u25BC -") + "$"
    + Math.abs(Math.round(diff)).toLocaleString() + "  (" + Math.abs(pct).toFixed(1) + "%)";
  $("nwDelta").style.color = diff>=0 ? "var(--pos)" : "var(--neg)";
  var vals = s.map(seriesVal);
  var lo = Math.min.apply(null,vals), hi = Math.max.apply(null,vals), span = (hi-lo)||1;
  $("chart").innerHTML = "";
  s.forEach(function(p){
    var d = document.createElement("div");
    d.style.height = Math.round((15 + ((seriesVal(p)-lo)/span)*85)/8)*8 + "%";
    $("chart").appendChild(d);
  });

  renderTicks(lo, hi, span);
}

/* 50K is the preferred gridline spacing; it only steps away when that would
   give fewer than two lines or more than eight (single-account selections). */
function tickStep(span){
  var n = span/50000;
  if(n >= 1.5 && n <= 8) return 50000;
  var c = [100,250,500,1000,2500,5000,10000,25000,50000,100000,250000,500000];
  for(var i=0;i<c.length;i++) if(span/c[i] <= 5) return c[i];
  return c[c.length-1];
}

function tickLabel(v){
  var a = Math.abs(v);
  if(a >= 1000000) return (v/1000000).toFixed(1).replace(/\.0$/,"") + "M";
  if(a >= 1000)    return Math.round(v/1000) + "K";
  return String(Math.round(v));
}

function renderTicks(lo, hi, span){
  var step = tickStep(span), out = "";
  var start = Math.ceil(lo/step)*step;
  for(var t=start; t<=hi; t+=step){
    /* Same mapping the bars use, so a line sits exactly at that value. */
    var pos = 15 + ((t-lo)/span)*85;
    if(pos < 4 || pos > 100) continue;
    out += '<div class="tick" style="bottom:'+pos+'%"><span>'+tickLabel(t)+'</span></div>';
  }
  $("ticks").innerHTML = out;
}

/* Categories given their own card at the top of the budget screen. */
var SPOTLIGHT = ["Date Night", "Entertainment"];

function findCat(name){
  for(var i=0;i<cats.length;i++)
    if(cats[i].name.toLowerCase() === name.toLowerCase()) return i;
  return -1;
}

function renderBudget(){
  var p = periods[mIdx];
  $("month").textContent = monthLabel(p.label);
  $("prev").disabled = mIdx===0;
  $("next").disabled = mIdx===periods.length-1;

  /* Hero: what is left over this month. */
  var hi = findCat("Total Difference");
  if(hi < 0) hi = findCat("Total Saved");
  var heroVal = hi >= 0 ? p.actual[hi] : 0;
  $("bHero").textContent = money(heroVal);
  $("bHero").style.color = heroVal < 0 ? "var(--neg)" : "var(--hi)";

  /* Spotlight cards. */
  $("spotlight").innerHTML = SPOTLIGHT.map(function(nm){
    var i = findCat(nm);
    if(i < 0) return "";
    var bal = p.balance[i];
    return '<div><div class="lbl">'+nm.toUpperCase()+'</div>'
         + '<div class="val" style="color:'+(bal<0?"var(--neg)":"var(--hi)")+'">'
         + money(bal)+'</div></div>';
  }).join("");

  /* Month summary. */
  var want = ["Total In","Total Out","Total Difference","Total Saved"];
  $("summary").innerHTML = cats.map(function(c,i){
    if(c.group!=="Summary" || want.indexOf(c.name)<0) return "";
    var v = p.actual[i], col = (v<0 && c.name!=="Total Out") ? "var(--neg)" : "var(--fg)";
    return '<div class="sum"><span>'+c.name.toUpperCase()
         + '</span><span style="color:'+col+'">'+money(v)+'</span></div>';
  }).join("");

  /* One continuous list, with a header at each group boundary. */
  var last = null, out = [];
  cats.forEach(function(c,i){
    if(c.group === "Summary") return;
    if(c.group !== last){ out.push('<div class="sect">'+c.group.toUpperCase()+'</div>'); last = c.group; }
    var bal = p.balance[i];
    out.push('<div class="row"><span class="nm">'+c.name.toUpperCase()
           + '</span><span class="amt" style="color:'+(bal<0?"var(--neg)":"var(--hi)")+'">'
           + money(bal)+'<span class="den">/'+money(p.goal[i])+'</span></span></div>');
  });
  $("budget").innerHTML = out.join("") || '<div class="row"><span class="nm">No rows</span></div>';
}

/* Goal given the spotlight at the top of the savings screen. */
var SPOTLIGHT_GOAL = "House Fund";

function goalPct(g){ return g.target>0 ? Math.max(0, Math.min(1, g.saved/g.target)) : 0; }

function meterHTML(pct){
  var on = Math.round(pct*10), out = "";
  for(var i=0;i<10;i++) out += '<i class="'+(i<on?"on":"")+'"></i>';
  return out;
}

function renderGoals(){
  var hero = null;
  for(var i=0;i<goals.length;i++)
    if(goals[i].name.toLowerCase() === SPOTLIGHT_GOAL.toLowerCase()){ hero = goals[i]; break; }
  if(!hero && goals.length) hero = goals[0];

  if(hero){
    var pct = goalPct(hero);
    $("gHero").textContent = money(hero.saved);
    $("gHeroLabel").textContent = hero.name.toUpperCase();
    $("gHeroSub").innerHTML = '<span>'+Math.round(pct*100)+'% OF GOAL</span>'
                            + '<span>'+money(hero.target)+'</span>';
    $("gHeroMeter").innerHTML = meterHTML(pct);
  } else {
    $("gHero").textContent = "\u2014";
    $("gHeroLabel").textContent = "";
    $("gHeroSub").innerHTML = "";
    $("gHeroMeter").innerHTML = "";
  }

  $("goals").innerHTML = goals.map(function(g){
    if(hero && g === hero) return "";   /* already shown above */
    var pct = goalPct(g);
    return '<div class="goal"><div class="top"><span>'+g.name.toUpperCase()
         + '</span><span style="color:var(--hi)">'+Math.round(pct*100)+'%</span></div>'
         + '<div class="meter">'+meterHTML(pct)+'</div></div>';
  }).join("");
}

/* No sign-out button any more. Run resetApp() from the console to switch sheets. */
window.resetApp = function(){
  if(sheetId) localStorage.removeItem(cacheKey());
  localStorage.removeItem("sheetId");
  if(token && google.accounts.oauth2.revoke) google.accounts.oauth2.revoke(token, function(){});
  location.reload();
};

$("prev").onclick = function(){ if(mIdx>0){ mIdx--; renderBudget(); } };
$("next").onclick = function(){ if(mIdx<periods.length-1){ mIdx++; renderBudget(); } };

Array.prototype.forEach.call($("rangeTabs").children, function(btn){
  btn.onclick = function(){
    Array.prototype.forEach.call($("rangeTabs").children, function(b){ b.setAttribute("aria-pressed","false"); });
    btn.setAttribute("aria-pressed","true");
    chartMonths = parseInt(btn.dataset.months,10);
    renderNetWorth();
  };
});
</script>
